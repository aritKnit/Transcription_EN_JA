services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    command:
      - python
      - run_server.py
      - --port=9090
      - --backend=${BACKEND:-sensevoice}
      - --model_path=/models/${MODEL_DIR}
      - --preload
      - --max_clients=${MAX_CLIENTS:-1}
      - --max_connection_time=${MAX_CONNECTION_TIME:-3600}
      - --omp_num_threads=${ENGINE_THREADS:-4}
      - --enable_rest
      - --rest_port=8000
      - --metrics_port=9091
    volumes:
      - ./models:/models:ro
    ports:
      # for testing from the host; the gateway reaches the engine over the compose network
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    cpus: ${ENGINE_CPUS:-4}
    mem_limit: ${ENGINE_MEM:-3g}
    restart: unless-stopped

  redis:
    image: redis:7
    # Streams must never be evicted, so memory is bounded by trimming each stream (MAXLEN), not by eviction.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-200mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      # for testing from the host; services reach it over the compose network as redis:6379
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: ${REDIS_MEM:-256m}
    restart: unless-stopped

volumes:
  redis-data:
